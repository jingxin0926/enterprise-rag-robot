# ================================================================
# Docker Compose 一键部署（开发 / 单机生产皆可）
# 启动：docker compose up -d
# ================================================================
services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
    container_name: smart-qa-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=INFO
      - LOG_CONSOLE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
      - DEEPSEEK_MODEL=deepseek-chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-smartqa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_qa}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app-data:/app/data      # 本地运行数据（非 Qdrant 向量数据）
      - app-logs:/app/logs      # 日志持久化
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G            # 内存限制（embedding 模型需要 ~2G）
          cpus: "4"

  # ==================== 文档异步 Worker ====================
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
    container_name: smart-qa-worker
    command: python -m app.worker.document_worker
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=INFO
      - LOG_CONSOLE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-smartqa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_qa}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  # ==================== Nginx 前端与网关 ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: smart-qa-nginx
    ports:
      - "80:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: smart-qa-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==================== MySQL 元数据存储 ====================
  mysql:
    image: mysql:8.0
    container_name: smart-qa-mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_qa}
      - MYSQL_USER=${MYSQL_USER:-smartqa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ==================== Qdrant 向量库 ====================
  qdrant:
    # 存量数据由 1.12 创建；升级 Qdrant 前必须先完成官方支持的存储迁移。
    image: qdrant/qdrant:v1.12.6
    container_name: smart-qa-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  app-data:
  app-logs:
  redis-data:
  qdrant-data:
  mysql-data:

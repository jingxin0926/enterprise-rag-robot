# ================================================================
# Docker Compose 一键部署（开发 / 单机生产皆可）
# 启动：docker compose up -d
# ================================================================
version: "3.8"

services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: smart-qa-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=INFO
      - LOG_CONSOLE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
      - DEEPSEEK_MODEL=deepseek-chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app-data:/app/data      # 本地运行数据（非 Qdrant 向量数据）
      - app-logs:/app/logs      # 日志持久化
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G            # 内存限制（embedding 模型需要 ~2G）
          cpus: "4"

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: smart-qa-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==================== Qdrant 向量库 ====================
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: smart-qa-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  app-data:
  app-logs:
  redis-data:
  qdrant-data:
